name: Shared offline checks
# Deliberately manual until the publisher decides the private-repository runner budget.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shared-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            sdk-bridge/package-lock.json
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Verify inactive candidate bytes and fixture hygiene
        run: python scripts/verify_source_lock.py
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Test shared UI
        working-directory: apps/desktop
        run: npm run test:frontend
      - name: Build shared UI
        working-directory: apps/desktop
        run: npm run build
      - name: Install pinned official SDK bridge dependencies
        working-directory: sdk-bridge
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Verify official SDK bridge offline (synthetic runtime only)
        working-directory: sdk-bridge
        run: npm run verify
      - name: Stage verified SDK readiness resources
        run: node sdk-bridge/scripts/package-readiness.mjs
      - name: Test Mac development bundle tooling offline (synthetic native responses)
        if: runner.os == 'macOS'
        run: node --test scripts/test_macos_dev_bundle.mjs
      - name: Test shared Rust core (never run ignored live tests)
        run: cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features -- --test-threads=1
      - name: Compile native shell
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features desktop
